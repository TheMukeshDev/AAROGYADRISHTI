name: aarogyadrishti
description: AarogyaDrishti - See Your Habits. Shape Your Health. Phase 1 lifestyle tracking MVP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Firebase Google authentication
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.2.2

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.1.1

  # Formatting
  intl: ^0.20.3

  # Android Health Connect / Health data
  health: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/